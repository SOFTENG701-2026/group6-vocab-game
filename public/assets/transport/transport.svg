<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <title>Magic Transport Logo</title>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="18" result="offsetBlur"/>
      <feFlood flood-color="#1d2b53" flood-opacity="0.22" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur"/>
      <feFlood flood-color="#1d2b53" flood-opacity="0.24" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="purpleText" x1="0" y1="560" x2="0" y2="835" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd5ff"/>
      <stop offset="0.48" stop-color="#c78cff"/>
      <stop offset="1" stop-color="#8b47df"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="820" x2="0" y2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dffcff"/>
      <stop offset="0.45" stop-color="#85e9ff"/>
      <stop offset="1" stop-color="#3aa9f5"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="735" x2="0" y2="1085" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3dd0d7"/>
      <stop offset="0.65" stop-color="#0c8da5"/>
      <stop offset="1" stop-color="#086b82"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8ec4"/>
      <stop offset="1" stop-color="#f84691"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe877"/>
      <stop offset="1" stop-color="#ffb72a"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ef6ff"/>
      <stop offset="1" stop-color="#35b8f1"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f4ff"/>
      <stop offset="1" stop-color="#a2c9ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      .roundFont{font-family:'Arial Rounded MT Bold','Trebuchet MS','Arial Black',sans-serif;font-weight:900;}
      .darkStroke{stroke:#4a2391;stroke-width:46;paint-order:stroke fill;stroke-linejoin:round;}
      .whiteStroke{stroke:#ffffff;stroke-width:22;paint-order:stroke fill;stroke-linejoin:round;}
      .blueDarkStroke{stroke:#00606f;stroke-width:42;paint-order:stroke fill;stroke-linejoin:round;}
      .blueWhiteStroke{stroke:#ffffff;stroke-width:18;paint-order:stroke fill;stroke-linejoin:round;}
      .cuteStroke{stroke:#4a3d65;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;}
      .highlight{fill:#fff;opacity:.55}
    ]]></style>
